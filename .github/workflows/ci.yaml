name: Run script tests
on:
  push:
  pull_request:
  release:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the 'alg paint' command
        run: uv run alg paint coleoptera_odb12 example_data/beetle_fulltables/Abax_parallelepipedus.tsv --busco-version odb12

      - name: Run the 'alg plot' command
        run: uv run alg plot coleoptera_odb12 ./example_data/output/abax_parallelepipedus/TESTING_paint_all_locations.tsv ./example_data/output/abax_parallelepipedus/TESTING_paint_chrom_lengths.tsv

      - name: Debug
        run: |
            ls
            echo "Now all"
            ls *

      # This will tell us if there is any difference between this and the truth data
      - name: Diff the output
        run: |
          diff ./alg/alg_painter_all_locations.tsv ./example_data/output/abax_parallelepipedus/TESTING_paint_all_locations.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: busco_painter_output
          path: buscopainter_*
          if-no-files-found: error
          retention-days: 5
          overwrite: true
